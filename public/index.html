<!-- Mercury AI Chat Panel -->
<button id="ai-toggle" title="Toggle Mercury AI Chat">AI</button>
<div id="mercury-ai-chat" class="ai-collapsed">

		<span id="ai-status-dot"></span>

<style>
#ai-toggle {
	position: fixed;
	right: 12px;
	top: 50%;
	transform: translateY(-50%);
	z-index: 200;
	width: auto;
	height: 25px;
	padding: 0 10px;
	border-radius: 2px;
	border-width: 0;
	background: var(--button-bg);
	color: var(--secundary);
	font-family: inherit;
	font-size: inherit;
	cursor: pointer;
	-webkit-app-region: no-drag;
	transition: opacity 0.2s;
}
#ai-toggle:hover {
	color: var(--accent);
	font-weight: bolder;
	background: var(--transparant);
	outline: 1pt solid var(--accent);
}
#ai-toggle.ai-hidden { opacity: 0; pointer-events: none; }

#mercury-ai-chat {
	position: fixed;
	right: 0; top: 0;
	width: 380px;
	height: 100vh;
	z-index: 150;
	display: flex;
	flex-direction: column;
	background: transparent;
	border-left: 1px solid var(--button-bg);
	font-family: inherit;
	color: var(--primary);
	transition: transform 0.25s ease;
}
#mercury-ai-chat.ai-collapsed {
	transform: translateX(100%);
}

#ai-header {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 8px 12px;
	flex-shrink: 0;
}
#ai-title {
	font-family: 'Major Mono Display', monospace;
	font-size: 0.85em;
	color: var(--secundary);
}
#ai-status-dot {
	width: 6px; height: 6px;
	border-radius: 50%;
	background: var(--record);
	flex-shrink: 0;
}
#ai-status-dot.ok {
	background: var(--accent);
}
#ai-status-text {
	font-size: 0.75em;
	color: var(--secundary);
	flex: 1;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
#ai-close {
	background: var(--transparant);
	border: none;
	color: var(--secundary);
	font-size: 16px;
	cursor: pointer;
	padding: 0 4px;
	line-height: 1;
	width: auto;
	-webkit-app-region: no-drag;
}
#ai-close:hover {
	color: var(--accent);
}

#ai-messages {
	flex: 1;
	overflow-y: auto;
	padding: 6px 12px;
	display: flex;
	flex-direction: column;
	gap: 4px;
	scrollbar-width: thin;
}

.ai-msg {
	padding: 0;
	font-size: 0.85em;
	line-height: 1.6;
	white-space: pre-wrap;
	word-wrap: break-word;
	max-width: 95%;
	background: transparent;
}
.ai-msg .ai-text {
	background-color: var(--cm-line);
	padding: 1px 6px;
	-webkit-box-decoration-break: clone;
	box-decoration-break: clone;
}
.ai-msg.user {
	align-self: flex-end;
	color: var(--accent);
	text-align: right;
}
.ai-msg.assistant {
	align-self: flex-start;
	color: var(--primary);
}
.ai-msg .ai-tool-badge {
	display: inline-block;
	font-size: 0.75em;
	padding: 1px 5px;
	background: var(--button-bg);
	color: var(--secundary);
	margin-top: 3px;
}

#ai-metrics {
	display: flex;
	gap: 8px;
	padding: 3px 12px;
	font-size: 0.7em;
	color: var(--secundary);
	flex-wrap: wrap;
	flex-shrink: 0;
}
#ai-metrics:empty { display: none; }
#ai-metrics .mv { color: var(--accent); }

#ai-input-area {
	display: flex;
	padding: 8px 12px;
	gap: 4px;
	flex-shrink: 0;
}
#ai-input {
	flex: 1;
	font-family: inherit;
	font-size: 0.85em;
	background: var(--textarea);
	color: var(--primary);
	border: none;
	border-radius: 2px;
	padding: 6px 8px;
	resize: none;
	outline: none;
	min-height: 28px;
	max-height: 80px;
	-webkit-app-region: no-drag;
}
#ai-input:focus {
	outline: 1pt solid var(--accent);
}
#ai-send {
	font-family: inherit;
	font-size: inherit;
	background: var(--button-bg);
	color: var(--secundary);
	border: none;
	border-radius: 2px;
	padding: 6px 12px;
	height: 25px;
	cursor: pointer;
	-webkit-app-region: no-drag;
}
#ai-send:hover {
	color: var(--accent);
	background: var(--transparant);
	outline: 1pt solid var(--accent);
}
#ai-send:disabled { opacity: 0.3; cursor: default; }
</style>

<script>
(function() {
	var AI_URL = localStorage.getItem('mercury-ai-url') || 'ws://localhost:3000/ws';

	var panel = document.getElementById('mercury-ai-chat');
	var toggle = document.getElementById('ai-toggle');
	var closeBtn = document.getElementById('ai-close');
	var messagesEl = document.getElementById('ai-messages');
	var inputEl = document.getElementById('ai-input');
	var sendBtn = document.getElementById('ai-send');
	var metricsEl = document.getElementById('ai-metrics');
	var statusDot = document.getElementById('ai-status-dot');
	var statusText = document.getElementById('ai-status-text');
	var uiEl = document.querySelector('.ui');

	var ws = null;
	var sending = false;
	var chatOpen = false;

	function openChat() {
		chatOpen = true;
		panel.classList.remove('ai-collapsed');
		toggle.classList.add('ai-hidden');
		if (uiEl) uiEl.style.marginRight = '395px';
		connectWs();
	}
	function closeChat() {
		chatOpen = false;
		panel.classList.add('ai-collapsed');
		toggle.classList.remove('ai-hidden');
		if (uiEl) uiEl.style.marginRight = '';
	}

	toggle.addEventListener('click', openChat);
	closeBtn.addEventListener('click', closeChat);

	function connectWs() {
		if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
		try { ws = new WebSocket(AI_URL); } catch(e) { setStatus(false, 'unreachable'); return; }
		ws.onopen = function() { setStatus(true, 'connected'); };
		ws.onclose = function() {
			setStatus(false, 'disconnected');
			if (sending) { resetSending(); addMsg('assistant', 'Connection lost.'); }
			if (chatOpen) setTimeout(connectWs, 4000);
		};
		ws.onerror = function() { setStatus(false, 'error'); };
		ws.onmessage = function(ev) {
			var data;
			try { data = JSON.parse(ev.data); } catch(e) { return; }
			handleMsg(data);
		};
	}

	function setStatus(ok, text) {
		statusDot.className = ok ? 'ok' : '';
		statusText.textContent = text || '';
	}

	function handleMsg(data) {
		if (data.type === 'token') {
			appendToken(data.content);
		} else if (data.type === 'tool') {
			appendToolBadge(data.name, data.result);
		} else if (data.type === 'done') {
			resetSending();
			showMetrics(data.metrics);
		} else if (data.error) {
			addMsg('assistant', 'Error: ' + data.error);
			resetSending();
		}
	}

	function resetSending() {
		sending = false;
		sendBtn.disabled = false;
		inputEl.disabled = false;
		inputEl.focus();
	}

	function addMsg(role, text) {
		var d = document.createElement('div');
		d.className = 'ai-msg ' + role;
		var s = document.createElement('span');
		s.className = 'ai-text';
		s.textContent = text;
		d.appendChild(s);
		messagesEl.appendChild(d);
		messagesEl.scrollTop = messagesEl.scrollHeight;
		return d;
	}

	function appendToken(tok) {
		var last = messagesEl.querySelector('.ai-msg.assistant:last-child');
		if (!last) last = addMsg('assistant', '');
		var span = last.querySelector('.ai-text');
		if (!span) { span = document.createElement('span'); span.className = 'ai-text'; last.insertBefore(span, last.firstChild); }
		span.textContent += tok;
		messagesEl.scrollTop = messagesEl.scrollHeight;
	}

	function appendToolBadge(name, result) {
		var last = messagesEl.querySelector('.ai-msg.assistant:last-child');
		if (!last) last = addMsg('assistant', '');
		var badge = document.createElement('span');
		badge.className = 'ai-tool-badge';
		badge.textContent = name + ': ' + (result || '').substring(0, 60);
		last.appendChild(document.createElement('br'));
		last.appendChild(badge);
	}

	function showMetrics(m) {
		if (!m || !m.generated_tokens) { metricsEl.innerHTML = ''; return; }
		var parts = [];
		parts.push('prompt: <span class="mv">' + m.prompt_tokens + '</span> tok');
		if (m.cache_read_tokens) parts.push('cached: <span class="mv">' + m.cache_read_tokens + '</span>');
		parts.push('gen: <span class="mv">' + m.generated_tokens + '</span> tok');
		if (m.gen_tok_per_sec) parts.push('<span class="mv">' + m.gen_tok_per_sec + '</span> t/s');
		if (m.total_ms) parts.push('total: <span class="mv">' + (m.total_ms/1000).toFixed(1) + 's</span>');
		metricsEl.innerHTML = parts.join(' &middot; ');
	}

	function send() {
		var text = inputEl.value.trim();
		if (!text || sending || !ws || ws.readyState !== WebSocket.OPEN) return;
		addMsg('user', text);
		sending = true;
		sendBtn.disabled = true;
		inputEl.disabled = true;
		inputEl.value = '';
		autoResize();
		ws.send(JSON.stringify({ message: text }));
	}

	sendBtn.addEventListener('click', send);
	inputEl.addEventListener('keydown', function(e) {
		if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
	});
	function autoResize() {
		inputEl.style.height = 'auto';
		inputEl.style.height = Math.min(inputEl.scrollHeight, 80) + 'px';
	}
	inputEl.addEventListener('input', autoResize);
})();
</script>
